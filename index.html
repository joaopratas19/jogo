<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comandante 112</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra de Topo -->
    <header class="top-bar">
        <div class="stats">
            <div id="player-rank" class="badge">Bombeiro de 3ª</div>
            <div id="player-funds">€ 50.000</div>
        </div>
    </header>

    <!-- Área Principal de Jogo -->
    <main id="game-view">
        
        <!-- ECRÃ 1: Ocorrências -->
        <section id="tab-ocorrencias" class="view-section active">
            <div class="section-header">
                <h2>Ocorrências Ativas</h2>
                <button id="btn-gerar" class="btn-action">Gerar Alerta 🚨</button>
            </div>
            <ul id="incident-list" class="incident-board"></ul>
        </section>

        <!-- ECRÃ 2: Garagem -->
        <section id="tab-garagem" class="view-section hidden">
            <div class="section-header">
                <h2>Garagem (Frota)</h2>
            </div>
            <ul id="frota-list" class="lista-simples"></ul>
        </section>

        <!-- ECRÃ 3: Pessoal e ENB -->
        <section id="tab-pessoal" class="view-section hidden">
            <div class="section-header">
                <h2>Efetivo (Quartel)</h2>
            </div>
            <ul id="pessoal-list" class="lista-simples"></ul>
        </section>

    </main>

    <!-- Menu Inferior -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="tab-ocorrencias">🚨<br>Alertas</button>
        <button class="nav-btn" data-target="tab-garagem">🚒<br>Frota</button>
        <button class="nav-btn" data-target="tab-pessoal">👥<br>Quartel</button>
    </nav>

    <!-- MODAL DE DESPACHO (Pop-up de Comando) -->
    <div id="modal-despacho" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-titulo">Comando Tático</h2>
            <p id="modal-info"></p>
            <hr>
            <h3>Viaturas Disponíveis</h3>
            <ul id="lista-veiculos-despacho" class="lista-simples"></ul>
            <div class="modal-botoes">
                <button id="btn-enviar-meios" class="btn-action">Confirmar Despacho</button>
                <button id="btn-fechar-modal" class="btn-cancelar">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="game.js"></script>
    <script src="ui.js"></script>
</body>
</html>
